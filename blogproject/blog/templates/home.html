{% extends 'base.html' %}

{% block content %}

<!-- 🔍 SEARCH -->

<form method="GET" action="/" class="search-box">
    <input type="text" name="q" placeholder="Search posts..." value="{{ query }}">
    <button type="submit">Search</button>
</form>

<!-- 🧱 CARD GRID -->

<div class="card-container">
    {% for post in posts %}
        <div class="card">
            <h3>{{ post.title }}</h3>
            <p>{{ post.content|truncatewords:20 }}</p>
            <a href="/post/{{ post.id }}/" class="read-btn">Explore →</a>
        </div>
    {% endfor %}
</div>

{% if not posts %} <p style="text-align:center;">No posts found.</p>
{% endif %}

{% endblock %}
