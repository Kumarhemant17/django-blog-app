{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Blog</title>

    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
</head>
<body>

    <h1>My Blog</h1>

    <div class="container">
        {% for post in posts %}
            <div class="post">
                <h2>{{ post.title }}</h2>
                <p>{{ post.content|truncatewords:20 }}</p>
                <a href="/post/{{ post.id }}/">Read More</a>
            </div>
        {% endfor %}
    </div>

    <script src="{% static 'blog/js/script.js' %}"></script>
</body>
</html>
